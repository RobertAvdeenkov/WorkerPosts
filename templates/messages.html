<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уведомления</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0d0d0d;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .frame {
            border: 10px solid #ffcc00;
            padding: 12px 24px;
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1, h2, h3 {
            color: #ffcc00;
            margin: 10px 0;
        }

        .container {
            background-color: #0d0d0d;
            text-align: center;
            min-width: 40%;
            height: auto;
            padding: 12px 12px;
            border-radius: 0%;
        }

        button {
            border-radius: 1%;
            background-color: #ffcc00;
            color: #000000;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: #e6b800;
        }

        a {
            color: #ffcc00;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .message {
            border: 1px solid #333;
            padding: 10px;
            margin: 10px 0;
            text-align: left;
            background: #1a1a1a;
            border-radius: 6px;
        }

        .message .text {
            color: #e0e0e0;
            margin: 5px 0;
        }

        .message .meta {
            font-size: 12px;
            color: #888;
        }

        .empty {
            color: #888;
            font-style: italic;
            margin: 20px 0;
        }

        .back {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="frame">
        <h1>Почтовый ящик</h1>

        <div class="container" id="messages">
            <!-- Сюда будут подгружаться уведомления -->
        </div>

        <div class="back">
            <a href="/mainpage">← На главную</a>
        </div>
    </div>

    <script>
        async function fetchWithAuth(url, options = {}) {
            let response = await fetch(url, options);
            if (response.status === 401 || response.status ===422) {
                const refreshResponse = await fetch('/refresh', { method: 'POST' });
                console.log(refreshResponse.status)
                if (refreshResponse.status!==401) {
                    response = await fetch(url, options); // повторяем запрос
                } else {
                    window.location.href = '/'; // refresh тоже истёк
                }
            }
            return response;
        }

        async function loadMessages() {
            const response = await fetchWithAuth('/messages');
            const data = await response.json();
            const container = document.getElementById('messages');
            container.innerHTML = '';

            if (!data.messages || data.messages.length === 0) {
                container.innerHTML = '<div class="empty">Уведомлений пока нет ¯\\_(ツ)_/¯</div>';
                return;
            }

            data.messages.forEach(msg => {
                container.innerHTML += `
                    <div class="message">
                        <div class="text">${msg.text}</div>
                        <div class="post-text" style="color: white;">${msg.post_text}</div>
                        <div class="meta">${msg.created_at}</div>
                    </div>
                `;
            });
        }

        loadMessages();
    </script>
</body>
</html>
